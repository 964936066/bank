<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太阳系八大行星 3D 科普</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>太阳系八大行星 · 3D 科普网站</h1>
      <p>拖拽旋转视角、滚轮缩放、点击行星查看介绍</p>
    </header>

    <main>
      <section id="scene-wrap">
        <canvas id="scene"></canvas>
      </section>

      <aside class="panel">
        <h2 id="planet-name">请选择一颗行星</h2>
        <p id="planet-desc">点击 3D 场景中的任意行星，将在这里显示详细科普信息。</p>
        <ul id="planet-facts"></ul>
      </aside>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
